name: Deploy portal

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      PA_CALLBACK_URL: ${{ secrets.PA_CALLBACK_URL }}
      GH_TOKEN: ${{ github.token }}
      COMMIT_SHA: ${{ github.sha }}
      APP_VERSION: ${{ needs.build.outputs.version }}
      DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Notify deployed
        run: |
          if [ -z "$PA_CALLBACK_URL" ]; then echo "::notice::PA_CALLBACK_URL is not set, skipping"; exit 0; fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // empty' || true)
          if [ -z "$pr" ]; then echo "::notice::No merged PR found for $COMMIT_SHA, skipping"; exit 0; fi
          sty() { grep -oE 'STY-[0-9]+' | head -n1 || true; }
          story=$(jq -r '.title // ""' <<<"$pr" | sty)
          [ -n "$story" ] || story=$(jq -r '.body // ""' <<<"$pr" | sty)
          [ -n "$story" ] || story=$(jq -r '.head.ref // ""' <<<"$pr" | sty)
          issue=$(jq -r '.body // ""' <<<"$pr" | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
          if [ -z "$story" ] && [ -n "$issue" ]; then
            story=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq .title 2>/dev/null | sty || true)
          fi
          if [ -z "$story" ]; then echo "::notice::No STY reference found, skipping"; exit 0; fi
          payload=$(jq -n --arg storyRef "$story" --argjson githubIssue "${issue:-null}" \
            --arg prUrl "$(jq -r .html_url <<<"$pr")" --arg commitSha "$COMMIT_SHA" \
            --arg version "$APP_VERSION" --arg deployUrl "$DEPLOY_URL" \
            '{storyRef: $storyRef, githubIssue: $githubIssue, event: "deployed", prUrl: $prUrl,
              commitSha: $commitSha, version: $version, deployUrl: $deployUrl}')
          curl -sS --fail-with-body --retry 2 -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$PA_CALLBACK_URL"
