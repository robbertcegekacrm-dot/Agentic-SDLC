name: CI

on:
  pull_request:
    # review_requested: Copilot requests a review when it has finished; that run can auto-merge.
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
    paths:
      - 'app/**'

permissions:
  contents: read
  issues: read
  pull-requests: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      story: ${{ steps.ref.outputs.story }}
      issue: ${{ steps.ref.outputs.issue }}
    env:
      PA_CALLBACK_URL: ${{ secrets.PA_CALLBACK_URL }}
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine story reference
        id: ref
        run: |
          sty() { grep -oE 'STY-[0-9]+' | head -n1 || true; }
          story=$(printf '%s' "$PR_TITLE" | sty)
          [ -n "$story" ] || story=$(printf '%s' "$PR_BODY" | sty)
          [ -n "$story" ] || story=$(printf '%s' "$PR_BRANCH" | sty)
          issue=$(printf '%s' "$PR_BODY" | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
          if [ -z "$story" ] && [ -n "$issue" ]; then
            story=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq .title 2>/dev/null | sty || true)
          fi
          echo "Story: ${story:-none}, issue: ${issue:-none}"
          echo "STORY_REF=$story" >> "$GITHUB_ENV"
          echo "GITHUB_ISSUE=${issue:-null}" >> "$GITHUB_ENV"
          echo "story=$story" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/notify.sh" <<'SCRIPT'
          notify() {
            if [ -z "$PA_CALLBACK_URL" ]; then echo "::notice::PA_CALLBACK_URL is not set, skipping '$1'"; return 0; fi
            if [ -z "$STORY_REF" ]; then echo "::notice::No STY reference found, skipping '$1'"; return 0; fi
            payload=$(jq -n --arg storyRef "$STORY_REF" --argjson githubIssue "$GITHUB_ISSUE" --arg event "$1" \
              --arg prUrl "$PR_URL" --arg commitSha "$COMMIT_SHA" --arg version "$APP_VERSION" \
              '{storyRef: $storyRef, githubIssue: $githubIssue, event: $event, prUrl: $prUrl,
                commitSha: $commitSha, version: $version, deployUrl: ""}')
            curl -sS --fail-with-body --retry 2 -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$PA_CALLBACK_URL" || echo "::warning::Callback '$1' failed"
          }
          SCRIPT

      - name: Notify pr_opened
        run: source "$RUNNER_TEMP/notify.sh" && notify pr_opened

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test && npm run test:e2e

      - name: Notify test result
        env:
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          source "$RUNNER_TEMP/notify.sh"
          if [ "$OUTCOME" = "success" ]; then notify tests_passed; else notify tests_failed; fi

      - name: Fail when tests failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::Tests failed"
          exit 1

  # Merges Copilot's PR without a human when the repository variable AUTO_MERGE is 'true', the tests passed,
  # Copilot has finished working and the linked issue carries the 'agentic-sdlc' label (only F2 creates those, and
  # F2 only runs for stories triage marked Autonomous: simple, low risk, confidence >= 80).
  auto-merge:
    needs: test
    if: vars.AUTO_MERGE == 'true' && github.event.pull_request.user.login == 'Copilot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: read
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PA_CALLBACK_URL: ${{ secrets.PA_CALLBACK_URL }}
      PR: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STORY_REF: ${{ needs.test.outputs.story }}
      ISSUE: ${{ needs.test.outputs.issue }}
    steps:
      - name: Check merge conditions
        id: check
        run: |
          skip() { echo "::notice::Auto-merge skipped: $1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$STORY_REF" ] || skip "no STY reference"
          last=$(gh api "repos/$GH_REPO/issues/$PR/timeline?per_page=100" --paginate \
            --jq '.[] | select(.event == "copilot_work_started" or .event == "copilot_work_finished") | .event' | tail -n1)
          [ "$last" = "copilot_work_finished" ] || skip "Copilot is still working"
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh api "repos/$GH_REPO/issues?labels=agentic-sdlc&state=all&per_page=100" \
              --jq "[.[] | select(.pull_request == null) | select(.title | contains(\"[$STORY_REF]\"))][0].number // empty")
          fi
          [ -n "$ISSUE" ] || skip "no linked GitHub issue for $STORY_REF"
          labels=$(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '[.labels[].name] | join(",")')
          [[ ",$labels," == *",agentic-sdlc,"* ]] || skip "issue #$ISSUE is not on the autonomous path"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Merge and deploy
        if: steps.check.outputs.go == 'true'
        env:
          ISSUE: ${{ steps.check.outputs.issue }}
        run: |
          [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = "true" ] && gh pr ready "$PR"
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            --body "Auto-merged: $STORY_REF is on the autonomous path (low risk) and CI passed."
          # A merge made with GITHUB_TOKEN does not trigger the push workflow, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
          if [ -n "$PA_CALLBACK_URL" ]; then
            payload=$(jq -n --arg storyRef "$STORY_REF" --argjson githubIssue "$ISSUE" --arg prUrl "$PR_URL" \
              --arg commitSha "$HEAD_SHA" '{storyRef: $storyRef, githubIssue: $githubIssue, event: "auto_merged",
              prUrl: $prUrl, commitSha: $commitSha, version: "", deployUrl: ""}')
            curl -sS --fail-with-body --retry 2 -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$PA_CALLBACK_URL" || echo "::warning::Callback 'auto_merged' failed"
          fi
